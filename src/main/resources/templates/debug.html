<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DocSpace Debug — File Links</title>
    <style>
        :root {
            --oo-blue: #5299E0;
            --oo-text: #333333;
            --oo-muted: #A3A9AE;
            --oo-border: #D0D5DA;
            --oo-bg: #F8F9F9;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 32px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--oo-text);
            background: #FFFFFF;
        }

        .oo-debug {
            max-width: 1120px;
            margin: 0 auto;
        }

        .oo-debug__header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 4px;
        }

        .oo-debug__title {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .oo-debug__badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #fff;
            background: var(--oo-blue);
        }

        .oo-debug__subtitle {
            margin: 0 0 24px;
            font-size: 0.9rem;
            color: var(--oo-muted);
        }

        .oo-card {
            border: 1px solid var(--oo-border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        table.oo-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        .oo-table thead th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--oo-muted);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            background: var(--oo-bg);
            border-bottom: 1px solid var(--oo-border);
            white-space: nowrap;
        }

        .oo-table tbody td {
            padding: 12px 16px;
            border-bottom: 1px solid #EDEEF0;
            vertical-align: top;
        }

        .oo-table tbody tr:last-child td {
            border-bottom: none;
        }

        .oo-table tbody tr:hover {
            background: #FBFCFC;
        }

        .oo-mono {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.8rem;
            word-break: break-all;
        }

        .oo-link {
            color: var(--oo-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .oo-link:hover { text-decoration: underline; }

        .oo-link--disabled {
            color: var(--oo-muted);
            pointer-events: none;
        }

        .oo-empty {
            padding: 48px 16px;
            text-align: center;
            color: var(--oo-muted);
            font-size: 0.95rem;
        }

        .oo-pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 20px;
        }

        .oo-pagination__info {
            font-size: 0.85rem;
            color: var(--oo-muted);
        }

        .oo-pagination__controls {
            display: flex;
            gap: 12px;
        }

        .oo-btn {
            display: inline-flex;
            align-items: center;
            height: 36px;
            padding: 0 18px;
            border: 1px solid var(--oo-border);
            border-radius: 3px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            text-decoration: none;
            color: var(--oo-text);
            background: #FFFFFF;
            cursor: pointer;
        }

        .oo-btn:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s;
        }

        .oo-btn--disabled {
            color: var(--oo-muted);
            background: var(--oo-bg);
            box-shadow: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="oo-debug">
    <div class="oo-debug__header">
        <h1 class="oo-debug__title">DocSpace &mdash; File Links</h1>
        <span class="oo-debug__badge">Debug</span>
    </div>
    <p class="oo-debug__subtitle">
        Synchronization links between DocSpace files and FineBI datasets. Administrators only.
    </p>

    <div class="oo-card">
        <table class="oo-table" th:if="${!links.isEmpty()}">
            <thead>
            <tr>
                <th>Dataset (tableId)</th>
                <th>Table name</th>
                <th>DocSpace file</th>
                <th>Folder</th>
                <th>Last reconciled</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="link : ${links}">
                <td class="oo-mono" th:text="${link.tableId}">uuid</td>
                <td th:text="${link.tableName}">name.xlsx</td>
                <td>
                    <a class="oo-link" th:if="${link.fileUrl != null}"
                       th:href="${link.fileUrl}" target="_blank" rel="noopener noreferrer"
                       th:text="${link.fileId}">fileId</a>
                    <span class="oo-mono" th:if="${link.fileUrl == null}" th:text="${link.fileId}">fileId</span>
                </td>
                <td>
                    <a class="oo-link" th:if="${link.folderUrl != null}"
                       th:href="${link.folderUrl}" target="_blank" rel="noopener noreferrer"
                       th:text="${link.folderId}">folderId</a>
                    <span class="oo-mono" th:if="${link.folderUrl == null}" th:text="${link.folderId}">folderId</span>
                </td>
                <td class="oo-mono" th:text="${link.lastReconciledAt}">timestamp</td>
            </tr>
            </tbody>
        </table>
        <div class="oo-empty" th:if="${links.isEmpty()}">
            No file links found on this page.
        </div>
    </div>

    <div class="oo-pagination">
        <span class="oo-pagination__info" th:text="'Page ' + ${page}">Page 1</span>
        <div class="oo-pagination__controls">
            <a class="oo-btn" th:classappend="${hasPrev} ? '' : 'oo-btn--disabled'"
               th:href="${hasPrev} ? @{${baseUrl}(page=${prevPage})} : '#'">&larr; Previous</a>
            <a class="oo-btn" th:classappend="${hasNext} ? '' : 'oo-btn--disabled'"
               th:href="${hasNext} ? @{${baseUrl}(page=${nextPage})} : '#'">Next &rarr;</a>
        </div>
    </div>
</div>
</body>
</html>
