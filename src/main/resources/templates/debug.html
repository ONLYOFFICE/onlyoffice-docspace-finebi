<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ONLYOFFICE DocSpace</title>
    <style>
        :root {
            --onlyoffice-blue: #5299E0;
            --onlyoffice-text: #333333;
            --onlyoffice-muted: #A3A9AE;
            --onlyoffice-border: #D0D5DA;
            --onlyoffice-bg: #F8F9F9;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 32px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--onlyoffice-text);
            background: #FFFFFF;
        }

        .onlyoffice-debug {
            max-width: 1120px;
            margin: 0 auto;
        }

        .onlyoffice-debug__header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 4px;
        }

        .onlyoffice-debug__title {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .onlyoffice-debug__badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #fff;
            background: var(--onlyoffice-blue);
        }

        .onlyoffice-debug__subtitle {
            margin: 0 0 24px;
            font-size: 0.9rem;
            color: var(--onlyoffice-muted);
        }

        .onlyoffice-debug__card {
            border: 1px solid var(--onlyoffice-border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        table.onlyoffice-debug-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        .onlyoffice-debug-table__heading {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--onlyoffice-muted);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            background: var(--onlyoffice-bg);
            border-bottom: 1px solid var(--onlyoffice-border);
            white-space: nowrap;
        }

        .onlyoffice-debug-table__cell {
            padding: 12px 16px;
            border-bottom: 1px solid #EDEEF0;
            vertical-align: top;
        }

        .onlyoffice-debug-table__row:last-child .onlyoffice-debug-table__cell {
            border-bottom: none;
        }

        .onlyoffice-debug-table__row:hover {
            background: #FBFCFC;
        }

        .onlyoffice-debug__mono {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.8rem;
            word-break: break-all;
        }

        .onlyoffice-debug__hash {
            max-width: 12rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            word-break: normal;
        }

        .onlyoffice-debug__link {
            color: var(--onlyoffice-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .onlyoffice-debug__link:hover { text-decoration: underline; }

        .onlyoffice-debug__empty {
            padding: 48px 16px;
            text-align: center;
            color: var(--onlyoffice-muted);
            font-size: 0.95rem;
        }

        .onlyoffice-debug__pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 20px;
        }

        .onlyoffice-debug__pagination-info {
            font-size: 0.85rem;
            color: var(--onlyoffice-muted);
        }

        .onlyoffice-debug__pagination-controls {
            display: flex;
            gap: 12px;
        }

        .onlyoffice-debug__button {
            display: inline-flex;
            align-items: center;
            height: 36px;
            padding: 0 18px;
            border: 1px solid var(--onlyoffice-border);
            border-radius: 3px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            text-decoration: none;
            color: var(--onlyoffice-text);
            background: #FFFFFF;
            cursor: pointer;
        }

        .onlyoffice-debug__button:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s;
        }

        .onlyoffice-debug__button--disabled {
            color: var(--onlyoffice-muted);
            background: var(--onlyoffice-bg);
            box-shadow: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="onlyoffice-debug">
    <div class="onlyoffice-debug__header">
        <h1 class="onlyoffice-debug__title">DocSpace &mdash; File Links</h1>
        <span class="onlyoffice-debug__badge">Debug</span>
    </div>
    <p class="onlyoffice-debug__subtitle">
        Synchronization links between DocSpace files and FineBI datasets
    </p>

    <div class="onlyoffice-debug__card">
        <table class="onlyoffice-debug-table" th:if="${!links.isEmpty()}">
            <thead>
            <tr>
                <th class="onlyoffice-debug-table__heading">Dataset (tableId)</th>
                <th class="onlyoffice-debug-table__heading">Sheet ID</th>
                <th class="onlyoffice-debug-table__heading">Content hash</th>
                <th class="onlyoffice-debug-table__heading">DocSpace file</th>
                <th class="onlyoffice-debug-table__heading">Last reconciled</th>
            </tr>
            </thead>
            <tbody>
            <tr class="onlyoffice-debug-table__row" th:each="link : ${links}">
                <td class="onlyoffice-debug-table__cell onlyoffice-debug__mono" th:text="${link.tableId}">uuid</td>
                <td class="onlyoffice-debug-table__cell onlyoffice-debug__mono" th:text="${link.sheetId}">7</td>
                <td class="onlyoffice-debug-table__cell onlyoffice-debug__mono onlyoffice-debug__hash"
                    th:text="${link.contentHash}" th:title="${link.contentHash}">hash</td>
                <td class="onlyoffice-debug-table__cell onlyoffice-debug__mono" th:text="${link.fileId}">fileId</td>
                <td class="onlyoffice-debug-table__cell onlyoffice-debug__mono" th:text="${link.lastReconciledAt}">timestamp</td>
            </tr>
            </tbody>
        </table>
        <div class="onlyoffice-debug__empty" th:if="${links.isEmpty()}">
            No file links found on this page.
        </div>
    </div>

    <div class="onlyoffice-debug__pagination">
        <span class="onlyoffice-debug__pagination-info" th:text="'Page ' + ${page}">Page 1</span>
        <div class="onlyoffice-debug__pagination-controls">
            <a class="onlyoffice-debug__button" th:classappend="${hasPrev} ? '' : 'onlyoffice-debug__button--disabled'"
               th:href="${hasPrev} ? @{${baseUrl}(page=${prevPage})} : '#'">Previous</a>
            <a class="onlyoffice-debug__button" th:classappend="${hasNext} ? '' : 'onlyoffice-debug__button--disabled'"
               th:href="${hasNext} ? @{${baseUrl}(page=${nextPage})} : '#'">Next</a>
        </div>
    </div>
</div>
</body>
</html>
